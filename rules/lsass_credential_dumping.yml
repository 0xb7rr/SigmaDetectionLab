title: Suspicious Process Access to LSASS Memory
id: 5e1b7a44-2d8c-4f6e-9a3b-4c7d9e1f44d4
status: experimental
description: >
  Detects a non-standard process opening a handle to lsass.exe with access rights
  consistent with credential dumping (e.g. PROCESS_VM_READ, PROCESS_QUERY_INFORMATION).
  Tools like Mimikatz, ProcDump (abused), and Task Manager "Create dump file" all
  generate this pattern. Legitimate access to lsass.exe is normally limited to a
  short allowlist of Windows system processes.
author: Kamal Ashraf (0xb7r)
date: 2026/09/14
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
logsource:
  product: windows
  category: process_access
  definition: 'Requires Sysmon Event ID 10 (ProcessAccess) with TargetImage lsass.exe'
detection:
  selection_target:
    TargetImage|endswith: '\lsass.exe'
  selection_access:
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
  filter_known_good:
    SourceImage|endswith:
      - '\svchost.exe'
      - '\wininit.exe'
      - '\services.exe'
      - '\MsMpEng.exe'
      - '\dwm.exe'
  condition: selection_target and selection_access and not filter_known_good
falsepositives:
  - Endpoint security agents and EDR sensors that legitimately inspect lsass.exe memory
  - Approved incident-response / forensic tooling used by the SOC during an investigation
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
